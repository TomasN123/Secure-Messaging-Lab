entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"


certificatesResolvers:
  myresolver:
    acme:
      email: 3novotnytomas@gmail.com
      storage: /acme/acme.json
     # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      httpChallenge:
        # used during the challenge
        entryPoint: web

providers:
  docker: {
    exposedByDefault: false
  }
  