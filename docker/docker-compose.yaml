
services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /data/traefik:/acme
    restart: unless-stopped

  whoami:
    image: traefik/whoami:latest
    container_name: whoami
    labels:
      -  traefik.http.routers.whoami.rule=Host(`traefik.cloud-telemetry.click`)
      -  traefik.http.routers.whoami.tls.certresolver=myresolver
      -  traefik.http.routers.whoami.entrypoints=websecure
      -  traefik.enable=true
    restart: unless-stopped
  postgres:
    image: postgres:16
    container_name: postgres
    volumes:
      - /data/postgres:/var/lib/postgresql/data
      - ./initdb.sh:/docker-entrypoint-initdb.d/initdb.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - KEYCLOAK_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
    restart: unless-stopped
  keycloak:
    image:  keycloak/keycloak:26.8
    container_name: keycloak
    command:  
      - start
    environment:
      - KC_HOSTNAME=keycloak.cloud-telemetry.click       # Public URL
      - KC_HTTP_ENABLED=true                             # Allow HTTP, behind traefik is no TLS/HTTPS anymore
      - KC_PROXY_HEADERS=xforwarded                      # Trust X-Forwarded-* from Traefik 
      - KC_DB=postgres                                   # DB type 
      - KC_DB_URL_HOST=postgres                          # docker-compose service name of Postgres
      - KC_DB_URL_DATABASE=keycloak                      # DB created in initdb.sh
      - KC_DB_USERNAME=keycloak                          # Role created in initdb.sh
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_BOOTSTRAP_ADMIN_USERNAME}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      -  traefik.http.routers.keycloak.rule=Host(`keycloak.cloud-telemetry.click`)
      -  traefik.http.routers.keycloak.entrypoints=websecure
      -  traefik.http.routers.keycloak.tls.certresolver=myresolver
      -  traefik.enable=true
      -  traefik.http.services.keycloak.loadbalancer.server.port=8080   
    restart: unless-stopped

  vault:
    image: hashicorp/vault:2.2
    container_name: vault
    command: 
      -  server
    restart: unless-stopped
    cap_add: 
      -  IPC_LOCK
    labels:
      -  traefik.http.routers.vault.rule=Host(`vault.cloud-telemetry.click`)
      -  traefik.http.routers.vault.tls.certresolver=myresolver
      -  traefik.http.routers.vault.entrypoints=websecure
      -  traefik.enable=true
      -  traefik.http.services.vault.loadbalancer.server.port=8200
    volumes:
      -  ./vault.hcl:/vault/config/vault.hcl:ro
      -  /data/vault:/vault/file
      -  /data/vault-audit:/vault/logs
  rabbit:
    image: rabbitmq:4.4.0-management-alpine
    container_name: rabbit
    hostname: rabbit
    profiles:
      - rabbit
    volumes:
      - /data/rabbitmq:/var/lib/rabbitmq
    labels:
      -  traefik.http.routers.rabbit.rule=Host(`rabbit.cloud-telemetry.click`)
      -  traefik.http.routers.rabbit.tls.certresolver=myresolver
      -  traefik.http.routers.rabbit.entrypoints=websecure
      -  traefik.enable=true
      -  traefik.http.services.rabbit.loadbalancer.server.port=15672
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 45s      
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}

  vault-agent:
    image: hashicorp/vault:2.2
    container_name: vault-agent
    command: 
      - vault
      - agent
      - -config=/vault/config/vault-agent.hcl
    volumes:
      - ./vault-agent.hcl:/vault/config/vault-agent.hcl:ro
      -  /data/agent-secrets:/vault/secrets
    restart: unless-stopped
    profiles:
      - rabbit
  vault-agent-consumer:
    image: hashicorp/vault:2.2
    container_name: vault-agent-consumer
    command: 
      - vault
      - agent
      - -config=/vault/config/vault-agent-consumer.hcl
    volumes:
      - ./vault-agent-consumer.hcl:/vault/config/vault-agent-consumer.hcl:ro
      -  /data/agent-secrets-consumer:/vault/secrets
    restart: unless-stopped
    profiles:
      - rabbit
  consumer:
    build: ./apps
    container_name: consumer
    profiles:
      - rabbit
    restart: unless-stopped
    command: 
      -  python
      -  consumer.py
    environment:
      - BROKER=rabbit
      - RABBITMQ_HOST=rabbit
      - CREDENTIALS_FILE=/vault/secrets/rabbit.env
    volumes:
      -  /data/agent-secrets-consumer:/vault/secrets:ro
    depends_on:
      rabbit:
        condition: service_healthy
  simulator:
    build: ./apps
    container_name: simulator
    profiles:
      - rabbit
    restart: unless-stopped
    command: 
      -  python
      -  simulator.py
    environment:
      - BROKER=rabbit
      - RABBITMQ_HOST=rabbit
      - CREDENTIALS_FILE=/vault/secrets/rabbit.env
    volumes:
      -  /data/agent-secrets:/vault/secrets:ro
    depends_on:
      consumer:
        condition: service_started
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    profiles:
      - rabbit
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /data/prometheus:/prometheus
  grafana:
    image: grafana/grafana:13.1
    container_name: grafana
    restart: unless-stopped
    profiles:
      - rabbit
    labels:
      -  traefik.http.routers.grafana.rule=Host(`grafana.cloud-telemetry.click`)
      -  traefik.http.routers.grafana.entrypoints=websecure
      -  traefik.http.routers.grafana.tls.certresolver=myresolver
      -  traefik.enable=true
      -  traefik.http.services.grafana.loadbalancer.server.port=3000
    volumes:
      -  /data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/dashboards:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}